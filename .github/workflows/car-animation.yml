name: Generate Car Animation

on:
  push:
    branches: [master]
  schedule:
    - cron: "0 0 * * 0"   # toda semana (opcional)
  workflow_dispatch:       # botão "Run workflow" manual

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pillow

      - name: Generate GIF
        run: python scripts/generate_car_gif.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add car.gif
          git diff --staged --quiet || git commit -m "chore: update car animation"
          git push
